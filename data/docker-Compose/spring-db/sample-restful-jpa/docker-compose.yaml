services: 
  restful-api:
    image: restful-api-sample:v1.0.0
    container_name: spring_cont
    # to build image: 
    
    build: 
    # # location of dockerfile, name of docker file
     context: . 
     dockerfile: dev.Dockerfile
     # for edit DockerFile arguments :
     args: 
      - PORT=${APP_PORT:-8080}
    # environment: 
    pull_policy: build #always build 
    # volumes: 
    #   - image-backup-vol:/app/filestorage/images
    ports: 
      - 8080:8080 # we can write : 8080 for allow docker auto select hostport .
    networks:
      - spring-net
  postgres:
    image: postgres:latest
    container_name: postgres_cont 
    environment: 
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes: 
      - postgres-data:/var/lib/postgresql
    networks:
      - spring-net
volumes: 
  image-backup-vol:
  postgres-data: 
networks:
  spring-net:
